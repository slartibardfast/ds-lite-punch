# The CLI authoring tool. Run it with an explicit host target, because the tree pins musl for every cargo command: cargo run --manifest-path tools/argdoc/Cargo.toml --target x86_64-unknown-linux-gnu
[workspace]

[package]
name = "argdoc"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    # The version comes from the shipping crate's manifest at run time, so clap needs its string feature.
    "string",
] }
clap_mangen = "0.3.3"