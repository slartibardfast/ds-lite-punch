# The front door on one port: a pass-through name carries TLS to the held port untouched, and a protected name terminates here and demands a client certificate (call/0038).

load_module <FRONT_MODULE>;

# The stream module is dynamic on Debian and Ubuntu so it must be named above, and server_name in a stream listener arrived after this nginx release, which is why a protected name is routed to the local https block below instead of terminating there.

worker_processes auto;
error_log <FRONT_ROOT>/logs/front.log info;
pid <FRONT_ROOT>/logs/front.pid;

events { worker_connections 1024; }

http {
    # The package keeps its temporary files and access log under /var, which a front running from its own root cannot use, so every path is stated, and every token here is substituted by whoever renders the file (the daemon from its routing table, or deploy/front-door/test-local.sh).

    client_body_temp_path <FRONT_ROOT>/tmp/client_body;
    proxy_temp_path       <FRONT_ROOT>/tmp/proxy;
    fastcgi_temp_path     <FRONT_ROOT>/tmp/fastcgi;
    uwsgi_temp_path       <FRONT_ROOT>/tmp/uwsgi;
    scgi_temp_path        <FRONT_ROOT>/tmp/scgi;
    access_log            <FRONT_ROOT>/logs/access.log;

    # The protected class: the only place a front certificate lives, and the only place a client certificate is checked.

    server {
        listen <LOCAL_TLS_LISTEN> ssl;
        server_name <PROTECTED_NAME>;

        ssl_certificate     <CERT_DIR>/front.crt;
        ssl_certificate_key <CERT_DIR>/front.key;
        ssl_client_certificate <CERT_DIR>/ca.crt;
        ssl_verify_client on;

        location / {
            proxy_pass http://<PROTECTED_UPSTREAM>;
            proxy_set_header Host $host;
        }
    }
}

stream {
    # The routing table: a published name maps to the carrier tuple the daemon reported, a protected name maps to the local block above, and a name nobody published maps to a port nothing serves.

    map $ssl_preread_server_name $backend {
        include <UPSTREAM_MAP>;
        default           <REJECT_BACKEND>;
        <PROTECTED_NAME>  <LOCAL_TLS_LISTEN>;
    }

    server {
        listen <PUBLIC_LISTEN>;
        ssl_preread on;
        proxy_pass $backend;
    }

    # The UDP leg has no name to route on, so it reads the same include through a map keyed on the listening port.

    map $server_port $udp_backend {
        include <UPSTREAM_MAP>;
        default <REJECT_BACKEND>;
    }

    server {
        listen <PUBLIC_UDP_LISTEN> udp;
        proxy_pass $udp_backend;
    }
}