# The hardest profile: symmetric (EDM + APDF) with per-destination allocation,
# sequential ports, and short timers. The shape plan/0004's investigation named
# as the one that would have forced the VPS-relay fallback.
mapping = EDM
filtering = APDF
port_assignment = sequential
sequential_base = 30000
udp_idle_s = 30
tcp_idle_s = 60
answered_spoke = on
protocol_scoping = on
mapping_protocols = none
