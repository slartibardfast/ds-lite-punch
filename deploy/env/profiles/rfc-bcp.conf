# The RFC best-case profile: RFC 4787 REQ-1 (EIM) and the two-minute UDP floor,
# address-independent filtering (EIF), the RFC 5382 TCP floor, and no admission
# precondition beyond an existing mapping.
mapping = EIM
filtering = EIF
port_assignment = preserve
udp_idle_s = 120
tcp_idle_s = 7440
answered_spoke = off
protocol_scoping = off
mapping_protocols = none
