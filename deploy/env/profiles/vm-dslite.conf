# The measured Virgin Media ds-lite profile (plan/0004, plan/0010, plan/0012-0014).
# The idle timers are the measured values: an order of magnitude under the RFC 4787
# REQ-5 floor, expiry silent. The mapping conflict between the measurement eras is
# recorded in the research note; this profile follows the front era (the operative
# behaviour for the front-door exchange) and names the alternative.
mapping = EDM
filtering = ADF
port_assignment = preserve
udp_idle_s = 12
tcp_idle_s = 60
answered_spoke = on
protocol_scoping = on
mapping_protocols = none
# alternative: mapping = EIM per the 2026-09-17 console session
