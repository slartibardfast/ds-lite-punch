# Runs the host's recorded build recipe verbatim, with the same image and /src mount, so a hash printed here is the hash the host re-derives from the pin.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1" # weekly, so drift finds us before a release does

# A stranger's pull request runs these jobs, and nothing in this lane needs to write.
permissions:
  contents: read

env:
  # Pinned by digest, and the host records this same value: a moved tag would invalidate every hash ever recorded under it.
  TOOLCHAIN: ghcr.io/rust-cross/rust-musl-cross@sha256:ce75e9174325d4fbb3de85c309e2d7ca29f7500169bc4b5d2c611ff7e86d549a
  ARTIFACT: target/x86_64-unknown-linux-musl/release/ds-lite-punch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The crate's .cargo/config.toml targets musl for every cargo command, so this builds and runs in the same pinned toolchain the artifact ships from.
      - name: Build and test in the pinned toolchain
        run: |
          docker run --rm -v "$PWD":/src -w /src "$TOOLCHAIN" \
            sh -c 'cargo test --release --locked'

  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the release artifact in the pinned toolchain
        run: |
          docker run --rm -v "$PWD":/src -w /src "$TOOLCHAIN" \
            sh -c 'cargo build --release --locked --target x86_64-unknown-linux-musl'
      # Printed in the form `.host-software` records, so re-deriving the anchor is a copy rather than a transcription.
      - name: Print the artifact hash as `.host-software` records it
        run: |
          printf 'artifact = %s %s\n' "$ARTIFACT" "$(sha256sum "$ARTIFACT" | cut -d' ' -f1)" | tee artifact-record.txt
      # The artifact leaves the job with its hash, and a missing file fails the job, so absence cannot read as success.
      - name: Upload the artifact and the line that records it
        uses: actions/upload-artifact@v4
        with:
          name: ds-lite-punch-x86_64-unknown-linux-musl
          path: |
            target/x86_64-unknown-linux-musl/release/ds-lite-punch
            artifact-record.txt
          if-no-files-found: error

  # One definition generates the help text and the manual page, and this job regenerates both and holds them to it.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The generated help text and manual page match their definition
        run: |
          # The generator builds for the host while the tree pins musl, so the target is named; regenerate and fail on any diff.
          cargo run --quiet --manifest-path tools/argdoc/Cargo.toml --target x86_64-unknown-linux-gnu
          git diff --exit-code -- src/help.txt deploy/man/ds-lite-punch.8
      - name: The manual page renders without a warning
        run: |
          # groff writes a warning to stderr and still exits 0, so the check is a non-empty stderr file.
          groff -man -ww -Tascii deploy/man/ds-lite-punch.8 > /dev/null 2> groff.txt
          if [ -s groff.txt ]; then
            cat groff.txt
            echo "::error::groff reports the manual page"
            exit 1
          fi
      - name: Every comment run is one line
        # call/0037 carries the rule; the corpus is at zero, so a new run of two lines fails here.
        run: python3 tools/comment-lint.py
      - name: Every relative link in the authored docs resolves
        run: sh tools/link-check.sh
      - name: The authored docs carry no prose tropes
        run: |
          # Built from /tmp at the pinned tag, because cargo reads its config from the working directory and this tree pins musl.
          git clone --quiet --depth 1 --branch v0.22.0 \
            https://github.com/connollydavid/host-lint /tmp/host-lint
          (cd /tmp && cargo build --quiet --release --manifest-path /tmp/host-lint/Cargo.toml)
          /tmp/host-lint/target/release/host-lint --docs .
      - name: Every name and number reads as a name
        # The lane reads a clause number, an item code or a version label as a tell; it is the same binary the prose step built.
        run: /tmp/host-lint/target/release/host-lint --all