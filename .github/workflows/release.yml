# A version bump MUST carry a matching annotated tag, and the tag is the release: this job builds the artifact from it in the recorded image and attaches the recorded line.
name: Release

on:
  push:
    tags: ["v*"]

env:
  TOOLCHAIN: ghcr.io/rust-cross/rust-musl-cross@sha256:ce75e9174325d4fbb3de85c309e2d7ca29f7500169bc4b5d2c611ff7e86d549a
  ARTIFACT: target/x86_64-unknown-linux-musl/release/ds-lite-punch

permissions:
  contents: write # the one job that creates a release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The published bytes have to be the bytes the host record anchors, and that record's hash comes from the host's release: the recorded build string, over the staged bundle, with the network off. A registry build hashes differently, so this job stages the bundle the committed lock names and builds the recipe the host runs.
      - name: Stage the recorded dependency bundle
        run: |
          read -r URL SHA _ < deps-bundle.lock
          curl -fsSL --retry 3 -o deps-vendor.tar.gz "$URL"
          echo "$SHA  deps-vendor.tar.gz" | sha256sum -c -
          tar xzf deps-vendor.tar.gz
          rm -f deps-vendor.tar.gz
          cat vendor-config.toml >> .cargo/config.toml
          rm -f vendor-config.toml
      - name: Build the release artifact in the pinned toolchain
        run: |
          # CARGO_HOME is left alone: the image's own cargo config names the musl linker, and hiding it links different bytes.
          docker run --rm --network none -v "$PWD":/src -w /src "$TOOLCHAIN" \
            sh -c 'cargo build --release --target x86_64-unknown-linux-musl'
          test -s "$ARTIFACT"
      # Printed in the form `.host-software` records, so a reader can compare the release with the anchor.
      - name: Record the artifact hash
        run: |
          printf 'artifact = %s %s\n' "$ARTIFACT" "$(sha256sum "$ARTIFACT" | cut -d' ' -f1)" | tee artifact-record.txt
          cat artifact-record.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Attach the binary, the manual page and the recorded line to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s "$ARTIFACT" ]; then
            echo "::error::no artifact to release: $ARTIFACT is missing or empty"
            exit 1
          fi
          # The manual page travels with the bytes it describes, read with: man -l ds-lite-punch.8
          if [ ! -s deploy/man/ds-lite-punch.8 ]; then
            echo "::error::no manual page to release: deploy/man/ds-lite-punch.8 is missing or empty"
            exit 1
          fi
          # Draft first, then publish: this repository's releases are immutable, so a freshly created release is frozen and an upload to it answers HTTP 422.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "ds-lite-punch $GITHUB_REF_NAME" \
              --notes "The musl-static release artifact for $GITHUB_REF_NAME, built from this tag inside the toolchain image recorded in the host's .host-software. artifact-record.txt carries the sha256 that record anchors. ds-lite-punch.8 is the manual page for those bytes; read it with 'man -l ds-lite-punch.8'."
          gh release upload "$GITHUB_REF_NAME" \
            "$ARTIFACT" artifact-record.txt deploy/man/ds-lite-punch.8 --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false