# The release lane.
#
# A version bump MUST carry a matching annotated tag, and the tag IS the
# release: this job builds the artifact from the tagged commit inside the same
# digest-pinned image the host's record names, prints the line the record uses,
# and attaches both to the release.
#
# A release asset is the point. Actions artifacts always need a token, even in
# a public repository: measured 2026-09-20, an anonymous listing answered 200
# and an anonymous download answered 401. A release asset is anonymously
# downloadable, so this is what makes the bytes a stranger can fetch the same
# bytes the host's pin describes.
name: Release

on:
  push:
    tags: ["v*"]

env:
  TOOLCHAIN: ghcr.io/rust-cross/rust-musl-cross@sha256:ce75e9174325d4fbb3de85c309e2d7ca29f7500169bc4b5d2c611ff7e86d549a
  ARTIFACT: target/x86_64-unknown-linux-musl/release/ds-lite-punch

permissions:
  contents: write # the one job that creates a release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the release artifact in the pinned toolchain
        run: |
          docker run --rm -v "$PWD":/src -w /src "$TOOLCHAIN" \
            sh -c 'cargo build --release --locked --target x86_64-unknown-linux-musl'
      # The hash is printed in the form `.host-software` records, so a reader
      # can compare the release with the anchor rather than trust a title.
      - name: Record the artifact hash
        run: |
          printf 'artifact = %s %s\n' "$ARTIFACT" "$(sha256sum "$ARTIFACT" | cut -d' ' -f1)" | tee artifact-record.txt
          cat artifact-record.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Attach the binary, the manual page and the recorded line to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s "$ARTIFACT" ]; then
            echo "::error::no artifact to release: $ARTIFACT is missing or empty"
            exit 1
          fi
          # The manual page travels with the bytes it describes, so an operator
          # who fetches the release and nothing else can still read how to run
          # it: `man -l ds-lite-punch.8`. Generated by tools/argdoc from the same
          # definition that produces the help text.
          if [ ! -s deploy/man/ds-lite-punch.8 ]; then
            echo "::error::no manual page to release: deploy/man/ds-lite-punch.8 is missing or empty"
            exit 1
          fi
          # Draft first, then publish, because immutable releases are enabled on
          # this repository: a freshly created release is frozen immediately, and
          # an upload to it answers
          #   HTTP 422: Cannot upload assets to an immutable release
          # (measured on 2026-09-21, on the release this step first ran for). A
          # draft is mutable, so the assets land and the release is published
          # once they have.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "ds-lite-punch $GITHUB_REF_NAME" \
              --notes "The musl-static release artifact for $GITHUB_REF_NAME, built from this tag inside the toolchain image recorded in the host's .host-software. artifact-record.txt carries the sha256 that record anchors. ds-lite-punch.8 is the manual page for those bytes; read it with 'man -l ds-lite-punch.8'."
          gh release upload "$GITHUB_REF_NAME" \
            "$ARTIFACT" artifact-record.txt deploy/man/ds-lite-punch.8 --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false