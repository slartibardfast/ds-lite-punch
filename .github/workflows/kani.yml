name: Kani

# The Kani rung on a runner: call/0019 defers the facade harnesses to a host where CBMC converges, so one job gates the tree's own harnesses and a second measures that question, each harness bounded so one that stops converging cannot hold the run.

on:
  workflow_dispatch:
  schedule:
    # Weekly, so a harness whose shape stops converging is news within a week.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  harnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install the Kani this tree's proofs were written against
        # The install runs outside the checkout: this tree pins musl for every cargo command, and Kani is a host tool.
        run: |
          cd "$RUNNER_TEMP"
          cargo install kani-verifier --locked --version 0.67.0
          cargo kani setup
      - name: List the harnesses
        run: |
          cargo kani list | grep -oE '[a-z_]+::[a-z_]+::[a-z_0-9]+' | sort -u > "$RUNNER_TEMP/harnesses.txt"
          echo "$(wc -l < "$RUNNER_TEMP/harnesses.txt") harness(es):"
          sed 's/^/  /' "$RUNNER_TEMP/harnesses.txt"
      - name: Verify the tree's own harnesses, each bounded
        # The bound is generous, because CBMC's search is the work; a harness that exceeds it fails this step alone.
        run: |
          set -uo pipefail
          fail=0
          while read -r h; do
            case "$h" in upnp::*) continue ;; esac
            if timeout 600 cargo kani --harness "$h" > "$RUNNER_TEMP/kani-${h//:/_}.log" 2>&1; then
              echo "PASS $h"
            else
              echo "FAIL $h"
              tail -25 "$RUNNER_TEMP/kani-${h//:/_}.log"
              fail=1
            fi
          done < "$RUNNER_TEMP/harnesses.txt"
          exit "$fail"
      - name: Upload the per-harness logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kani-logs
          path: ${{ runner.temp }}/kani-*.log
          if-no-files-found: error

  facade:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # call/0019 records these as never run green anywhere, so this job produces the verdicts a record can rest on.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install the Kani this tree's proofs were written against
        # The version is pinned: a harness is written against a CBMC search strategy, and a new Kani is a new measurement.
        run: |
          cd "$RUNNER_TEMP"
          cargo install kani-verifier --locked --version 0.67.0
          cargo kani setup
      - name: List the harnesses
        run: |
          cargo kani list | grep -oE '[a-z_]+::[a-z_]+::[a-z_0-9]+' | sort -u > "$RUNNER_TEMP/harnesses.txt"
      - name: Measure the facade harnesses, each bounded
        run: |
          set -uo pipefail
          while read -r h; do
            case "$h" in upnp::*) ;; *) continue ;; esac
            if timeout 900 cargo kani --harness "$h" > "$RUNNER_TEMP/kani-${h//:/_}.log" 2>&1; then
              echo "PASS $h"
            else
              echo "FAIL-OR-BOUND $h"
              tail -12 "$RUNNER_TEMP/kani-${h//:/_}.log"
            fi
          done < "$RUNNER_TEMP/harnesses.txt"
      - name: Upload the per-harness logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kani-facade-logs
          path: ${{ runner.temp }}/kani-*.log
          if-no-files-found: error